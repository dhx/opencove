name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  ci-ubuntu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Secret scan
        run: pnpm secrets:scan

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm check

      - name: Unit tests (PR)
        if: github.event_name == 'pull_request'
        run: pnpm test -- --run

      - name: Unit tests with coverage (main)
        if: github.event_name == 'push'
        run: pnpm test:coverage

      - name: Terminal recovery native contracts
        run: pnpm test:terminal-recovery:native

      - name: Build
        run: pnpm build

      - name: Upload coverage artifact
        if: github.event_name == 'push' && always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  web-canvas-continuity-ubuntu:
    runs-on: ubuntu-latest
    # Official Playwright image: browsers and their system libraries are baked in, so no apt step can
    # stall the job. Its tag must match @playwright/test in pnpm-lock.yaml (ci-e2e-browser-provisioning.spec.ts).
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
      options: --ipc=host

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Chromium continuity tests
        timeout-minutes: 30
        env:
          OPENCOVE_E2E_SKIP_BUILD: '1'
          OPENCOVE_E2E_RETRIES: '0'
        run: >-
          pnpm test:e2e:web-canvas --
          tests/e2e-web-canvas/workerWebCanvas.terminal-auto-calibration.spec.ts
          tests/e2e-web-canvas/workerWebCanvas.terminal-live-reattach-geometry.spec.ts
          tests/e2e-web-canvas/workerWebCanvas.themes.spec.ts
          tests/e2e-web-canvas/workerWebCanvas.canvas-images.spec.ts
          tests/e2e-web-canvas/workerWebCanvas.canvas-file-drop.spec.ts
          --project=chromium --retries=0

      - name: WebKit calibration and theme tests
        timeout-minutes: 30
        env:
          OPENCOVE_E2E_SKIP_BUILD: '1'
          OPENCOVE_E2E_RETRIES: '0'
        run: >-
          pnpm test:e2e:web-canvas --
          tests/e2e-web-canvas/workerWebCanvas.terminal-auto-calibration.spec.ts
          tests/e2e-web-canvas/workerWebCanvas.themes.spec.ts
          tests/e2e-web-canvas/workerWebCanvas.canvas-images.spec.ts
          tests/e2e-web-canvas/workerWebCanvas.canvas-file-drop.spec.ts
          --project=webkit --retries=0

      - name: Upload Web Canvas artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts-web-canvas
          path: |
            test-results-web-canvas/
            playwright-report-web-canvas/
          retention-days: 7

      - name: Cleanup Web Canvas temp dirs
        if: always()
        run: |
          if [ -n "${RUNNER_TEMP:-}" ]; then rm -rf "${RUNNER_TEMP}/opencove-web-canvas" || true; fi
          rm -rf "/tmp/opencove-web-canvas" || true

  # The Electron E2E suite (tests/e2e) against the worker and its Web UI in Chromium
  # (OPENCOVE_E2E_TARGET=web, playwright.e2e-web.config.ts; docs/dhx/RELEASES.md). Releases wait for it.
  e2e-web:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    runs-on: ubuntu-latest
    # Official Playwright image: browsers and their system libraries are baked in, so no apt step can
    # stall the job. Its tag must match @playwright/test in pnpm-lock.yaml (ci-e2e-browser-provisioning.spec.ts).
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
      options: --ipc=host

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: E2E tests on the Web UI (shard)
        timeout-minutes: 30
        env:
          OPENCOVE_E2E_RETRIES: '0'
        run: pnpm exec playwright test -c playwright.e2e-web.config.ts --shard=${{ matrix.shard }}/8

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts-e2e-web-shard-${{ matrix.shard }}
          path: |
            test-results-e2e-web/
          retention-days: 7

      - name: Cleanup E2E temp dirs
        if: always()
        run: |
          if [ -n "${RUNNER_TEMP:-}" ]; then rm -rf "${RUNNER_TEMP}/opencove-e2e" || true; fi
          rm -rf "/mnt/opencove-e2e" "/tmp/opencove-e2e" || true
