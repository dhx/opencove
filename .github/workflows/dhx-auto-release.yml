# Releases main automatically (docs/dhx/RELEASES.md): when upstream's CI workflow finishes green for a
# push to main, the commit gets the next version (<next patch of package.json>-dhx-<nnn>) and
# dhx-release.yml builds, checks and publishes it. A commit that main has moved past, or that already has
# a release, is skipped.
name: dhx auto release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dhx-auto-release
  cancel-in-progress: false

jobs:
  version:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.next.outputs.version }}
      commit: ${{ steps.next.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Next version
        id: next
        env:
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --quiet --tags origin main
          if [ "$(git rev-parse origin/main)" != "$COMMIT" ]; then
            echo "main has moved past $COMMIT; its own CI run releases it"; exit 0
          fi
          if git tag --points-at "$COMMIT" | grep -q '^dhx/v'; then
            echo "$COMMIT is released already: $(git tag --points-at "$COMMIT" | grep '^dhx/v')"; exit 0
          fi
          base="$(node -p 'const [a, b, c] = require("./package.json").version.split("-")[0].split(".").map(Number); `${a}.${b}.${c + 1}`')"
          last="$(git tag --list "dhx/v${base}-dhx-*" | sed "s#^dhx/v${base}-dhx-##" | sort -n | tail -n1)"
          version="$(printf '%s-dhx-%03d' "$base" "$((10#${last:-0} + 1))")"
          echo "releasing $COMMIT as $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

  release:
    needs: version
    if: needs.version.outputs.version != ''
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/dhx-release.yml
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ needs.version.outputs.commit }}
      publish: true
