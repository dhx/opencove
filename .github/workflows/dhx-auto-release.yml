# Releases main automatically (docs/dhx/RELEASES.md). dhx-release.yml builds, checks and attests every push
# to main while upstream's CI runs; when CI finishes green for that push, this publishes that very build.
# A commit main has moved past, or one that already has a release, is skipped.
name: dhx auto release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dhx-auto-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish the build of this commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --quiet --tags origin main
          if [ "$(git rev-parse origin/main)" != "$COMMIT" ]; then
            echo "main has moved past $COMMIT; its own CI run releases it"; exit 0
          fi
          if git tag --points-at "$COMMIT" | grep -q '^dhx/v'; then
            echo "$COMMIT is released already: $(git tag --points-at "$COMMIT" | grep '^dhx/v')"; exit 0
          fi
          # The release build started with the push; it is usually done long before CI.
          for _ in $(seq 1 90); do
            run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow dhx-release.yml --commit "$COMMIT" --event push \
              --json databaseId,status,conclusion -q '.[0] | "\(.databaseId) \(.status) \(.conclusion)"')"
            set -- $run
            [ "${2:-}" = completed ] && break
            sleep 20
          done
          if [ "${3:-}" != success ]; then
            echo "the release build of $COMMIT did not succeed (${run:-none found})" >&2; exit 1
          fi
          gh run download "$1" --repo "$GITHUB_REPOSITORY" --name session-desk-server --dir build
          version="$(cat build/VERSION)"
          if git rev-parse -q --verify "refs/tags/dhx/v${version}" >/dev/null; then
            echo "dhx/v${version} exists on another commit (pushed while it was released); re-run dhx release for main" >&2
            exit 1
          fi
          (cd build/release && sha256sum -c SHA256SUMS.txt)
          gh release create "dhx/v${version}" build/release/* --repo "$GITHUB_REPOSITORY" --target "$COMMIT" \
            --title "Session Desk $version" \
            --notes "Session Desk server build at ${COMMIT}, built while CI ran and released when CI was green. Based on OpenCove; not an official OpenCove build. Verify: sha256sum -c SHA256SUMS.txt, and gh attestation verify session-desk-server-linux-x64.tar.gz --repo ${GITHUB_REPOSITORY}."
