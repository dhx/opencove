# Our own Session Desk server releases (docs/dhx/RELEASES.md). Builds session-desk-server-linux-x64.tar.gz from
# this fork with a checksum-verified Node runtime, pinned build images and pinned actions, runs upstream's
# cheap gates and our own release checks, and publishes a GitHub release with checksums, an SBOM and
# build provenance.
#
# Tags are dhx/v<version> (e.g. dhx/v0.4.1-dhx-001), so upstream's release.yml (v*) never runs for them.
#
# - Push to main: builds and checks the next version (<next patch of package.json>-dhx-<nnn>) right away,
#   while upstream's CI runs, and attests it; dhx-auto-release.yml publishes this very build once CI is
#   green. The gates CI runs for the same commit (lint, types, unit tests) are not repeated here.
# - Pushed tag dhx/v<version>: builds, runs every gate and check, attests and publishes in one go.
# - Pull request or manual run: builds and checks without publishing.
name: dhx release

on:
  push:
    tags: ['dhx/v*']
    branches: [main]
  # Docs-only pull requests skip the trial build, as they skip CI (see ci.yml).
  pull_request:
    paths: ['**', '!docs/**', 'docs/plugins/**', '!*.md']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp, e.g. 0.4.1-dhx-001 (a manual run only builds and checks)'
        required: true

permissions:
  contents: read

env:
  NODE_VERSION: '22.23.4'
  NODE_SHA256: '1805bcd35e6815559bd2eb97db438d3fdb0eb3a5e6a977b7c1badca76337e9ce' # node-v22.23.4-linux-x64.tar.xz, nodejs.org SHASUMS256.txt
  NATIVE_BUILD_IMAGE: 'quay.io/pypa/manylinux_2_28_x86_64@sha256:e2808351a165aa85913d79f1f8457b4f6d74047b47fba07b5b9a5e6c0055a017'
  SMOKE_IMAGE: 'debian:bookworm-slim@sha256:7ff6ba31527b9e336162fa061746c366c4b2032f4d2cff2078bea43f78efe3f8'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  # The published bundle's name, for the file and its top folder. The build names it opencove-server-linux-x64
  # (upstream's install and managed-SSH code use that name; neither runs from our releases), and Collect repacks it.
  ASSET: 'session-desk-server-linux-x64'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write # build provenance, on pushes
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the tags, for the next version
          persist-credentials: false

      - name: Version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          case "${GITHUB_EVENT_NAME}:${REF_NAME}" in
            push:dhx/v*) version="${REF_NAME#dhx/v}" ;;
            push:main)
              base="$(node -p 'const [a, b, c] = require("./package.json").version.split("-")[0].split(".").map(Number); `${a}.${b}.${c + 1}`')"
              last="$(git tag --list "dhx/v${base}-dhx-*" | sed "s#^dhx/v${base}-dhx-##" | sort -n | tail -n1)"
              version="$(printf '%s-dhx-%03d' "$base" "$((10#${last:-0} + 1))")" ;;
            *) version="${INPUT_VERSION:-0.0.0-dhx-000}" ;; # manual: given; a pull request: a trial build
          esac
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-dhx-[0-9]{3}$'; then
            echo "version must look like 0.4.1-dhx-001, not $version" >&2; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Node runtime (verified)
        run: |
          curl -fsSLo node.tar.xz "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
          echo "${NODE_SHA256}  node.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/node" && tar -xJf node.tar.xz -C "$RUNNER_TEMP/node" --strip-components=1 && rm node.tar.xz
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
          echo "OPENCOVE_NODE_EXECUTABLE=$RUNNER_TEMP/node/bin/node" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.6.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Stamp the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm pkg set version="$VERSION"
          # A stable (non-nightly) version needs release notes of its own; ours are upstream's latest.
          latest="$(ls build/release-notes/stable/ | sort -V | tail -n1)"
          jq --arg v "$VERSION" '.version = $v' "build/release-notes/stable/$latest" > "build/release-notes/stable/v$VERSION.json"

      - name: Gates (upstream's cheap checks; on main, CI runs them for this commit)
        if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
        run: |
          pnpm secrets:scan
          pnpm lint
          pnpm format:check
          pnpm check
          pnpm test -- --run

      - name: Build the server bundle
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          OPENCOVE_NATIVE_BUILD_IMAGE: ${{ env.NATIVE_BUILD_IMAGE }}
        run: pnpm build:standalone

      - name: Collect
        run: |
          mkdir -p release
          # Repack under our name: same contents, modes and symlinks, only the top folder renamed.
          mkdir -p repack
          tar -xzf dist/opencove-server-linux-x64.tar.gz -C repack
          mv repack/opencove-server-linux-x64 "repack/${ASSET}"
          tar -czf "release/${ASSET}.tar.gz" -C repack "${ASSET}"
          test "$(tar -tzf "release/${ASSET}.tar.gz" | cut -d/ -f1 | sort -u)" = "${ASSET}"
          test "$(tar -tzvf dist/opencove-server-linux-x64.tar.gz | sed 's#opencove-server-linux-x64/##' | awk '{$4=$5=""; print}' | sort)" \
            = "$(tar -tzvf "release/${ASSET}.tar.gz" | sed "s#${ASSET}/##" | awk '{$4=$5=""; print}' | sort)"
          # The bundle as built, for upstream's smoke test: it installs through opencove-install.sh, which expects
          # upstream's name. Not published.
          mkdir -p as-built
          cp dist/opencove-server-linux-x64.tar.gz as-built/
          (cd as-built && sha256sum opencove-server-linux-x64.tar.gz > SHA256SUMS.txt)
          (cd release && sha256sum "${ASSET}.tar.gz" > SHA256SUMS.txt && cat SHA256SUMS.txt)
          printf '%s\n' "${{ steps.version.outputs.version }}" > VERSION

      - name: Our checks (what the bundle contains, what it reaches)
        run: |
          mkdir -p extracted && tar -xzf "release/${ASSET}.tar.gz" -C extracted
          node scripts/dhx/check-release-bundle.mjs "$(dirname "$(find extracted -maxdepth 2 -type d -name app | head -n1)")"
          docker run --rm --network none -v "$PWD:/workspace:ro" -w /workspace "$SMOKE_IMAGE" \
            sh scripts/dhx/egress-smoke.sh "/workspace/release/${ASSET}.tar.gz"

      - name: Upstream's container smoke test
        run: |
          docker run --rm -v "$PWD:/workspace:ro" -w /workspace "$SMOKE_IMAGE" \
            sh scripts/smoke-standalone-node-runtime.sh /workspace/as-built/opencove-server-linux-x64.tar.gz

      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: extracted
          format: spdx-json
          output-file: release/${{ env.ASSET }}.spdx.json
          upload-artifact: false

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name == 'push'
        with:
          subject-path: release/${{ env.ASSET }}.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: session-desk-server
          path: |
            release/
            VERSION
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/dhx/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: session-desk-server

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "dhx/v${VERSION}" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Session Desk $VERSION" \
            --notes "Session Desk server build at ${GITHUB_SHA}. Based on OpenCove; not an official OpenCove build. Verify: sha256sum -c SHA256SUMS.txt, and gh attestation verify ${ASSET}.tar.gz --repo ${GITHUB_REPOSITORY}."
